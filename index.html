<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>درس تفاعلي</title>
    <style>
        body { background-color: #2f3136; color: white; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
    </style>
</head>
<body>
    <h1>مرحباً بك في الدرس التفاعلي!</h1>
    <p id="user-info">جاري التحقق من هويتك عبر ديسكورد...</p>

    <!-- استدعاء مكتبة ديسكورد للأنشطة -->
    <script src="https://discord.com/api/embed/sdk.js"></script>
    <script>
        const discordSdk = new DiscordSDK('أدخل_معرف_التطبيق_هنا_Client_ID');

        async function init() {
            await discordSdk.ready();
            const auth = await discordSdk.commands.authorize({
                client_id: 'أدخل_معرف_التطبيق_هنا_Client_ID',
                response_type: 'code',
                state: '',
                prompt: 'none',
                scope: ['identify', 'guilds']
            });

            // عرض اسم المستخدم للتأكد من نجاح الاتصال
            const user = auth.user;
            document.getElementById('user-info').innerText = `أهلاً بك يا ${user.username}! تم التحقق بنجاح.`;
        }
        init();
    </script>
</body>
</html>
