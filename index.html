<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyRBG - Intro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #070709;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
            border-radius: 50%;
            animation: pulseBg 6s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes pulseBg {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            perspective: 1200px;
            margin-bottom: 35px;
        }

        .brand-name {
            display: flex;
            gap: 4px;
        }

        .brand-name span {
            display: inline-block;
            font-size: 6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 20%, #a855f7 70%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(-150px) rotateX(90deg) rotateY(180deg) scale(0.5);
            animation: assembleLetter 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 15px 25px rgba(168, 85, 247, 0.3));
        }

        .brand-name span:nth-child(1) { animation-delay: 0.3s; }
        .brand-name span:nth-child(2) { animation-delay: 0.45s; }
        .brand-name span:nth-child(3) { animation-delay: 0.6s; }
        .brand-name span:nth-child(4) { animation-delay: 0.75s; }
        .brand-name span:nth-child(5) { animation-delay: 0.9s; }

        @keyframes assembleLetter {
            0% {
                opacity: 0;
                transform: translateY(-150px) rotateX(90deg) rotateY(180deg) scale(0.5);
                filter: drop-shadow(0 0 0 rgba(168, 85, 247, 0));
            }
            70% {
                opacity: 1;
                transform: translateY(15px) rotateX(-15deg) rotateY(-10deg) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateX(0deg) rotateY(0deg) scale(1);
                filter: drop-shadow(0 15px 30px rgba(168, 85, 247, 0.4));
            }
        }

        .brand-name-wrapper {
            animation: floatingWord 4s ease-in-out infinite alternate 1.8s;
        }

        @keyframes floatingWord {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(1deg); }
        }

        .progress-container {
            position: relative;
            z-index: 2;
            width: 260px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInBar 0.8s ease 1.5s forwards;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        @keyframes fadeInBar {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            animation: fillProgress 8.5s cubic-bezier(0.25, 1, 0.5, 1) 1.5s forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        body.fade-out {
            animation: fadeOutPage 0.8s ease forwards;
        }

        @keyframes fadeOutPage {
            to {
                opacity: 0;
                transform: scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .brand-name span {
                font-size: 3.8rem;
            }
            .progress-container {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container brand-name-wrapper">
        <h1 class="brand-name">
            <span>P</span>
            <span>y</span>
            <span>R</span>
            <span>B</span>
            <span>G</span>
        </h1>
    </div>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

    <script>
        setTimeout(() => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 800);
        }, 10000);
    </script>

</body>
</html>
