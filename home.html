<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyRBG - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #070709;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(99, 102, 241, 0.03) 50%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .sidebar {
            width: 280px;
            height: 100vh;
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.hidden {
            transform: translateX(-100%);
            opacity: 0;
        }

        .sidebar-header {
            padding: 25px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 20%, #a855f7 70%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .close-menu-btn {
            background: none;
            border: none;
            color: #a855f7;
            font-size: 1.2rem;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }

        .close-menu-btn:hover {
            background: rgba(168, 85, 247, 0.1);
            transform: scale(1.05);
        }

        .sidebar-menu {
            list-style: none;
            padding: 20px 15px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .menu-item {
            padding: 12px 18px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: #94a3b8;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #475569;
            transition: background 0.3s, transform 0.3s;
        }

        .menu-item:hover {
            background: rgba(168, 85, 247, 0.08);
            color: #ffffff;
            transform: translateX(4px);
        }

        .menu-item:hover::before {
            background: #a855f7;
            transform: scale(1.4);
        }

        .menu-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
            color: #ffffff;
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.1);
        }

        .menu-item.active::before {
            background: #6366f1;
            box-shadow: 0 0 10px #6366f1;
        }

        .toggle-menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9;
            background: rgba(15, 15, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            pointer-events: none;
        }

        .toggle-menu-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .toggle-menu-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        .main-content {
            flex-grow: 1;
            margin-left: 280px;
            height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: margin-left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
            position: relative;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .lesson-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            background: rgba(15, 15, 20, 0.4);
            backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: fadeInFrame 0.5s ease;
        }

        @keyframes fadeInFrame {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                max-width: 280px;
            }
            .main-content {
                margin-left: 0 !important;
                padding: 15px;
                padding-top: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <button class="toggle-menu-btn" id="toggleBtn" onclick="toggleMenu()">
        <span>☰ Menu</span>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">PyRBG</h1>
            <button class="close-menu-btn" onclick="toggleMenu()" title="CloseM">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item active" onclick="switchLesson('lesson1.html', this)">Introduction</li>
            <li class="menu-item" onclick="switchLesson('lesson2.html', this)"></li>
            <li class="menu-item" onclick="switchLesson('lesson3.html', this)"></li>
        </ul>
    </aside>

    <main class="main-content" id="mainContent">
        <iframe src="lesson1.html" class="lesson-frame" id="lessonFrame"></iframe>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const toggleBtn = document.getElementById('toggleBtn');
        const lessonFrame = document.getElementById('lessonFrame');

        function toggleMenu() {
            sidebar.classList.toggle('hidden');
            mainContent.classList.toggle('expanded');
            
            if (sidebar.classList.contains('hidden')) {
                toggleBtn.classList.add('visible');
            } else {
                toggleBtn.classList.remove('visible');
            }
        }

        function switchLesson(pageUrl, element) {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
          
            lessonFrame.src = pageUrl;
        }
    </script>

</body>
</html>
